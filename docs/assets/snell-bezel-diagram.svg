<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 430" width="1120" height="430" role="img" aria-labelledby="title desc">
  <title id="title">TrueGlass Optical Physics vs Standard CSS Backdrop Blur</title>
  <desc id="desc">Cross-section diagram comparing flat CSS backdrop-filter blur against TrueGlass G2 superellipse Snell bezel refraction with Cauchy RGB chromatic dispersion and a distortion-free interior.</desc>
  <defs>
    <style>
      .t-sans { font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .t-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="55%" stop-color="#0a0e18" />
      <stop offset="100%" stop-color="#07090f" />
    </linearGradient>

    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111520" />
      <stop offset="100%" stop-color="#0b0e16" />
    </linearGradient>

    <linearGradient id="card-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#131a2c" />
      <stop offset="50%" stop-color="#0e1524" />
      <stop offset="100%" stop-color="#0b101b" />
    </linearGradient>

    <linearGradient id="css-slab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08" />
    </linearGradient>

    <linearGradient id="tg-lens" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.24" />
      <stop offset="35%" stop-color="#38bdf8" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.18" />
    </linearGradient>

    <linearGradient id="tg-rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.95" />
      <stop offset="32%" stop-color="#38bdf8" stop-opacity="0.45" />
      <stop offset="68%" stop-color="#818cf8" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="0.82" />
    </linearGradient>

    <radialGradient id="glow-blue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.26" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1" />
    </pattern>

    <marker id="arr-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#64748b" />
    </marker>
    <marker id="arr-white" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#cbd5e1" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#fb7185" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#4ade80" />
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
  </defs>

  <!-- Outer Canvas -->
  <rect width="1120" height="430" rx="20" fill="url(#bg)" />
  <rect width="1120" height="430" rx="20" fill="url(#grid)" />
  <rect x="0.5" y="0.5" width="1119" height="429" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity="0.1" />

  <!-- Top Header -->
  <text x="36" y="42" class="t-sans" fill="#f8fafc" font-size="16" font-weight="650" letter-spacing="-0.02em">Optical Cross-Section: Why Physical Refraction Feels Different</text>
  <text x="1084" y="42" text-anchor="end" class="t-mono" fill="#38bdf8" font-size="11.5" font-weight="500">n₁ sin(θ₁) = n₂ sin(θ₂) · IOR 1.50</text>
  <line x1="36" y1="58" x2="1084" y2="58" stroke="#ffffff" stroke-opacity="0.08" />

  <!-- LEFT CARD: Standard CSS Glass -->
  <g transform="translate(36, 78)">
    <rect width="496" height="318" rx="16" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.09" />
    <text x="24" y="34" class="t-sans" fill="#94a3b8" font-size="14" font-weight="600">Standard CSS Glass</text>
    <rect x="336" y="17" width="136" height="24" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.09" />
    <text x="404" y="33" text-anchor="middle" class="t-mono" fill="#94a3b8" font-size="10.5">backdrop-filter: blur</text>

    <!-- Backdrop baseline -->
    <line x1="36" y1="262" x2="460" y2="262" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 4" />
    <text x="248" y="284" text-anchor="middle" class="t-sans" fill="#64748b" font-size="11">Underlying Scene (Uniformly Blurred Everywhere)</text>

    <!-- Parallel unrefracted rays -->
    <g stroke="#64748b" stroke-width="1.6" stroke-opacity="0.7" marker-end="url(#arr-muted)">
      <line x1="108" y1="82" x2="108" y2="254" />
      <line x1="178" y1="82" x2="178" y2="254" />
      <line x1="248" y1="82" x2="248" y2="254" />
      <line x1="318" y1="82" x2="318" y2="254" />
      <line x1="388" y1="82" x2="388" y2="254" />
    </g>

    <!-- Flat rectangular slab -->
    <rect x="86" y="138" width="324" height="58" rx="6" fill="url(#css-slab)" stroke="#94a3b8" stroke-opacity="0.32" stroke-width="1.25" />
    <text x="248" y="171" text-anchor="middle" class="t-sans" fill="#cbd5e1" font-size="12" font-weight="500">Flat Plane · Zero Optical Bending</text>

    <!-- Callout pills -->
    <text x="24" y="305" class="t-mono" fill="#64748b" font-size="10.5">✕ No perimeter lensing   ✕ No RGB dispersion   ✕ Static border</text>
  </g>

  <!-- RIGHT CARD: TrueGlass Physical Optical Engine -->
  <g transform="translate(556, 78)">
    <rect width="528" height="318" rx="16" fill="url(#card-accent)" stroke="#38bdf8" stroke-opacity="0.32" />
    <ellipse cx="264" cy="170" rx="220" ry="88" fill="url(#glow-blue)" />

    <text x="24" y="34" class="t-sans" fill="#f8fafc" font-size="14" font-weight="650">TrueGlass Physical Engine</text>
    <rect x="336" y="17" width="168" height="24" rx="12" fill="#38bdf8" fill-opacity="0.14" stroke="#38bdf8" stroke-opacity="0.35" />
    <text x="420" y="33" text-anchor="middle" class="t-mono" fill="#7dd3fc" font-size="10.5">G² Bezel + Cauchy RGB</text>

    <!-- Backdrop baseline -->
    <line x1="36" y1="262" x2="492" y2="262" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="4 4" />
    <text x="264" y="284" text-anchor="middle" class="t-sans" fill="#94a3b8" font-size="11">Curved Bezel Pulls Peripheral Backdrop · Flat Center Stays Razor-Sharp</text>

    <!-- Incident rays above lens -->
    <g stroke="#e2e8f0" stroke-width="1.6" stroke-opacity="0.88">
      <!-- Left bezel incident -->
      <line x1="116" y1="80" x2="116" y2="146" />
      <!-- Center straight rays -->
      <line x1="210" y1="80" x2="210" y2="254" marker-end="url(#arr-white)" />
      <line x1="264" y1="80" x2="264" y2="254" marker-end="url(#arr-white)" />
      <line x1="318" y1="80" x2="318" y2="254" marker-end="url(#arr-white)" />
      <!-- Right bezel incident -->
      <line x1="412" y1="80" x2="412" y2="146" />
    </g>

    <!-- Curved G2 Superellipse Meniscus Cross-Section -->
    <path d="M 80 198
             C 80 156, 108 134, 168 134
             L 360 134
             C 420 134, 448 156, 448 198
             Z"
          fill="url(#tg-lens)" stroke="url(#tg-rim)" stroke-width="2" />

    <!-- Interior flat plateau marker -->
    <line x1="168" y1="124" x2="360" y2="124" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="1" />
    <line x1="168" y1="120" x2="168" y2="128" stroke="#38bdf8" stroke-opacity="0.7" stroke-width="1" />
    <line x1="360" y1="120" x2="360" y2="128" stroke="#38bdf8" stroke-opacity="0.7" stroke-width="1" />
    <rect x="174" y="102" width="180" height="19" rx="9.5" fill="#0d1526" stroke="#38bdf8" stroke-opacity="0.32" />
    <text x="264" y="115" text-anchor="middle" class="t-mono" fill="#7dd3fc" font-size="9.5">Clear Interior (0px bend)</text>

    <!-- Surface Normal Vector (Left Bezel) -->
    <line x1="116" y1="146" x2="86" y2="108" stroke="#f59e0b" stroke-width="1.3" stroke-dasharray="3 3" />
    <text x="64" y="101" text-anchor="middle" class="t-mono" fill="#fbbf24" font-size="10">Normal (G²)</text>

    <!-- Left Bezel Cauchy RGB Dispersed Refracted Rays -->
    <path d="M 116 146 L 136 198 L 154 254" fill="none" stroke="#fb7185" stroke-width="1.8" marker-end="url(#arr-red)" />
    <path d="M 116 146 L 145 198 L 172 254" fill="none" stroke="#4ade80" stroke-width="1.8" marker-end="url(#arr-green)" />
    <path d="M 116 146 L 154 198 L 190 254" fill="none" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arr-blue)" />

    <!-- Right Bezel Cauchy RGB Dispersed Refracted Rays -->
    <path d="M 412 146 L 392 198 L 374 254" fill="none" stroke="#fb7185" stroke-width="1.8" marker-end="url(#arr-red)" />
    <path d="M 412 146 L 383 198 L 356 254" fill="none" stroke="#4ade80" stroke-width="1.8" marker-end="url(#arr-green)" />
    <path d="M 412 146 L 374 198 L 338 254" fill="none" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arr-blue)" />

    <!-- Specular Rim Glint Dot -->
    <circle cx="102" cy="154" r="4" fill="#ffffff" fill-opacity="0.92" />
    <circle cx="102" cy="154" r="10" fill="#7dd3fc" fill-opacity="0.32" />
    <text x="48" y="168" class="t-mono" fill="#e0f2fe" font-size="9.5">Fresnel</text>
    <text x="48" y="180" class="t-mono" fill="#e0f2fe" font-size="9.5">Rim</text>

    <!-- RGB Legend Card (Cleanly positioned right of incident ray) -->
    <g transform="translate(428, 72)">
      <rect x="-10" y="-12" width="88" height="54" rx="8" fill="#0b1120" fill-opacity="0.9" stroke="#ffffff" stroke-opacity="0.1" />
      <circle cx="0" cy="0" r="3.2" fill="#fb7185" /><text x="8" y="3.5" class="t-mono" fill="#fca5a5" font-size="9.2">R · 1.48</text>
      <circle cx="0" cy="15" r="3.2" fill="#4ade80" /><text x="8" y="18.5" class="t-mono" fill="#86efac" font-size="9.2">G · 1.50</text>
      <circle cx="0" cy="30" r="3.2" fill="#38bdf8" /><text x="8" y="33.5" class="t-mono" fill="#7dd3fc" font-size="9.2">B · 1.53</text>
    </g>

    <!-- Bottom checkmark summary -->
    <text x="24" y="305" class="t-mono" fill="#7dd3fc" font-size="10.5">✓ Snell bezel lensing   ✓ Cauchy RGB split   ✓ GPU tilt specular rim</text>
  </g>
</svg>
